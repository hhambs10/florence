<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#272733">
  <meta name="description" content="Schermata di abbonamento urbano dimostrativa.">
  <link rel="manifest" href="manifest.json">
  <title>Urbano Capoluogo</title>
  <style>
    :root {
      --bg: #272733;
      --panel: #003a2a;
      --primary: #5792f5;
      --text: #f7f7f7;
      --accent: #20d8c7;
      --link: #77a7ff;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    button, input { font: inherit; }

    .app {
      height: 100svh;
      max-width: 560px;
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .close {
      appearance: none;
      border: 0;
      padding: 0;
      width: 36px;
      height: 36px;
      background: transparent;
      color: var(--text);
      font-size: 45px;
      line-height: 30px;
      font-weight: 200;
      cursor: pointer;
    }

    .heading {
      margin-top: clamp(30px, 5.5vh, 56px);
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .ticket-icon {
      flex: 0 0 auto;
      width: 55px;
      height: 42px;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6.4vw, 33px);
      line-height: 1.18;
      letter-spacing: .015em;
      font-weight: 650;
    }

    .period {
      margin-top: clamp(40px, 7vh, 72px);
      padding: 22px 23px;
      border: 0;
      border-radius: 18px;
      background: var(--panel);
    }

    /* Una riga contiene due blocchi indipendenti: etichetta + data e orario.
       Il secondo blocco può andare a capo, quindi non si sovrappone mai alla data. */
    .date-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 8px;
      width: 100%;
      font-size: clamp(17px, 4.65vw, 24px);
      line-height: 1.45;
      font-weight: 750;
    }

    .date-line + .date-line { margin-top: 7px; }

    .date-prefix {
      flex: 0 0 auto;
      min-width: 31px;
    }

    .date-picker {
      position: relative;
      display: grid;
      flex: 0 0 108px;
      width: 108px;
      height: 34px;
      cursor: pointer;
    }

    .date-picker input[type="date"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }

    .date-picker input[type="date"]::-webkit-calendar-picker-indicator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .date-display {
      align-self: center;
      min-width: 0;
      padding-bottom: 1px;
      border-bottom: 1px solid transparent;
      color: var(--text);
      font: inherit;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
    }

    .date-time {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .date-picker:hover .date-display,
    .date-picker:focus-within .date-display {
      border-bottom-color: var(--accent);
    }

    .instructions {
      margin: clamp(34px, 5.5vh, 52px) 0 0;
      color: var(--text);
      font-size: clamp(15px, 4vw, 20px);
      line-height: 1.4;
    }

    .more-info {
      width: fit-content;
      margin-top: 17px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--link);
      font-size: clamp(15px, 4vw, 19px);
      cursor: pointer;
    }

    .more-info:hover,
    .more-info:focus-visible { text-decoration: underline; }

    .tax-section { margin-top: clamp(36px, 5.8vh, 58px); }

    .tax-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      gap: 6px;
      width: 100%;
      color: var(--text);
      font-size: clamp(17px, 4.35vw, 22px);
      white-space: nowrap;
    }

    .tax-label { flex: 0 0 auto; }

    #taxCode {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
      padding: 0 0 2px;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: inherit;
      line-height: 1.2;
      letter-spacing: .025em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    #taxCode::placeholder {
      color: rgba(247, 247, 247, .55);
      letter-spacing: 0;
    }

    #taxCode:hover,
    #taxCode:focus { border-bottom-color: var(--primary); }

    .spacer { flex: 1 1 auto; min-height: 12px; }

    .info-button {
      flex: 0 0 auto;
      width: 100%;
      min-height: 66px;
      border: 0;
      border-radius: 25px;
      background: var(--primary);
      color: #050505;
      font-size: 23px;
      font-weight: 700;
      cursor: pointer;
    }

    .info-button:hover { filter: brightness(1.06); }
    .info-button:active { transform: scale(.99); }
    .info-button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

    dialog {
      width: min(420px, calc(100% - 40px));
      padding: 0;
      border: 0;
      border-radius: 18px;
      background: #343440;
      color: var(--text);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .55);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .6); }
    .dialog-content { padding: 24px; }
    .dialog-content h2 { margin: 0; font-size: 22px; }
    .dialog-content p { margin: 14px 0 0; color: #e3e5e9; line-height: 1.45; }

    .dialog-close {
      margin-top: 22px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #050505;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-height: 680px) {
      .app { padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .heading { margin-top: 20px; }
      .period { margin-top: 28px; }
      .instructions { margin-top: 25px; font-size: 15px; }
      .tax-section { margin-top: 26px; }
      .info-button { min-height: 57px; }
    }

    @media (max-width: 370px) {
      .app { padding-left: 16px; padding-right: 16px; }
      .heading { gap: 12px; }
      .ticket-icon { width: 47px; }
      h1 { font-size: 23px; }
      .period { padding-left: 16px; padding-right: 16px; }
      .date-line { font-size: 16px; }
      .date-prefix { min-width: 27px; }
      .date-picker { flex-basis: 96px; width: 96px; }
      .tax-row { font-size: 16px; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <button class="close" type="button" aria-label="Chiudi" onclick="history.back()">×</button>

    <header class="heading">
      <svg class="ticket-icon" viewBox="0 0 100 70" aria-hidden="true" fill="none">
        <g transform="rotate(-14 50 35)">
          <rect x="10" y="13" width="80" height="44" rx="7" stroke="currentColor" stroke-width="6"/>
          <rect x="24" y="25" width="15" height="13" rx="1" stroke="currentColor" stroke-width="5"/>
          <path d="M52 26h22" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>
      <h1>URBANO CAPOLUOGO 1<br>MESE ISEE</h1>
    </header>

    <section class="period" aria-label="Periodo di validità">
      <div class="date-line">
        <span class="date-prefix">Dal</span>
        <label class="date-picker" aria-label="Modifica data di inizio">
          <span class="date-display" id="startDateDisplay">01/09/2026</span>
          <input id="startDate" type="date" value="2026-09-01" aria-label="Data di inizio">
        </label>
        <span class="date-time">alle 00:00</span>
      </div>
      <div class="date-line">
        <span class="date-prefix">Al</span>
        <label class="date-picker" aria-label="Modifica data di fine">
          <span class="date-display" id="endDateDisplay">30/09/2026</span>
          <input id="endDate" type="date" value="2026-09-30" aria-label="Data di fine">
        </label>
        <span class="date-time">alle 23:59</span>
      </div>
    </section>

    <p class="instructions">
      In caso di controllo esibire la tessera sanitaria. In case of verification, you must show your health card or tax code. Valido per il servizio urbano della città indicata, nel periodo selezionato.
    </p>

    <button class="more-info" type="button" id="moreInfo">Per saperne di più</button>

    <section class="tax-section">
      <div class="tax-row">
        <label class="tax-label" for="taxCode">Codice fiscale :</label>
        <input id="taxCode" name="taxCode" type="text" inputmode="text" autocomplete="off" maxlength="16" placeholder="Inserisci" aria-label="Codice fiscale">
      </div>
    </section>

    <div class="spacer"></div>
    <button class="info-button" type="button" id="infoButton">Info</button>
  </main>

  <dialog id="infoDialog" aria-labelledby="dialogTitle">
    <div class="dialog-content">
      <h2 id="dialogTitle">Dati dell'abbonamento</h2>
      <p id="dialogText"></p>
      <button class="dialog-close" type="button" id="dialogClose">Chiudi</button>
    </div>
  </dialog>

  <script>
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');
    const startDateDisplay = document.getElementById('startDateDisplay');
    const endDateDisplay = document.getElementById('endDateDisplay');
    const taxCode = document.getElementById('taxCode');
    const dialog = document.getElementById('infoDialog');
    const dialogText = document.getElementById('dialogText');

    function formatItalianDate(isoDate) {
      if (!isoDate) return '';
      const [year, month, day] = isoDate.split('-');
      return `${day}/${month}/${year}`;
    }

    function updateDateDisplays() {
      startDateDisplay.textContent = formatItalianDate(startDate.value);
      endDateDisplay.textContent = formatItalianDate(endDate.value);
    }

    function normalizeTaxCode() {
      taxCode.value = taxCode.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '')
        .slice(0, 16);
    }

    taxCode.addEventListener('input', normalizeTaxCode);

    endDate.addEventListener('change', () => {
      if (startDate.value && endDate.value < startDate.value) {
        endDate.value = startDate.value;
      }
      updateDateDisplays();
    });

    startDate.addEventListener('change', () => {
      if (endDate.value && endDate.value < startDate.value) {
        endDate.value = startDate.value;
      }
      updateDateDisplays();
    });

    document.getElementById('infoButton').addEventListener('click', () => {
      normalizeTaxCode();

      if (!taxCode.value) {
        dialogText.textContent = 'Inserisci il codice fiscale per visualizzare i dati dell’abbonamento.';
      } else if (taxCode.value.length !== 16) {
        dialogText.textContent = 'Il codice fiscale deve contenere 16 caratteri alfanumerici.';
      } else {
        dialogText.textContent = `Periodo selezionato: dal ${formatItalianDate(startDate.value)} alle 00:00 al ${formatItalianDate(endDate.value)} alle 23:59. Codice fiscale: ${taxCode.value}.`;
      }

      dialog.showModal();
    });

    document.getElementById('moreInfo').addEventListener('click', () => {
      dialogText.textContent = 'Questa è una schermata dimostrativa. Per un servizio reale, la validità del titolo dovrebbe essere verificata da un sistema server-side.';
      dialog.showModal();
    });

    document.getElementById('dialogClose').addEventListener('click', () => dialog.close());

    updateDateDisplays();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
